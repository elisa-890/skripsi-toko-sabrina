# =====================================================================
# nginx_contoh.conf
# -----------------------------------------------------------------
# Contoh konfigurasi server block Nginx untuk Dashboard Toko Sabrina.
# WAJIB dipakai kalau web server-nya Nginx, karena Nginx TIDAK membaca
# file .htaccess sama sekali (beda dengan Apache).
#
# Cara pakai:
# 1. Sesuaikan `server_name`, `root`, dan versi PHP-FPM socket di bawah.
# 2. Simpan sebagai /etc/nginx/sites-available/toko-sabrina
# 3. Aktifkan: sudo ln -s /etc/nginx/sites-available/toko-sabrina /etc/nginx/sites-enabled/
# 4. Tes konfigurasi: sudo nginx -t
# 5. Reload: sudo systemctl reload nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name toko-sabrina.namadomainanda.com;   # <-- ganti dengan domain/IP VPS Anda

    root /var/www/toko_sabrina;                    # <-- ganti sesuai lokasi upload di VPS
    index index.php login.php;

    client_max_body_size 20M;   # cukup untuk unggah file .xlsx impor data

    # -------------------------------------------------------------
    # BLOKIR akses langsung ke file & folder sensitif (WAJIB)
    # -------------------------------------------------------------
    location ~* \.(db|sqlite|sqlite3|sql|pkl|py|pyc)$ {
        deny all;
        return 404;
    }

    location ^~ /config/ {
        deny all;
        return 404;
    }

    location ^~ /python/ {
        deny all;
        return 404;
    }

    location = /BACA_SAYA.txt {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------
    # Routing normal aplikasi
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Sesuaikan versi PHP-FPM yang terpasang di VPS, contoh PHP 8.2:
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
